name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile project additions
        run: >-
          python -m py_compile
          app.py
          ultralytics/nn/modules/swin_backbone.py
          ultralytics/nn/tasks.py
